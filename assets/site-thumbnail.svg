<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">HailCast website thumbnail</title>
  <desc id="desc">Apple Weather inspired hail forecasting preview with storm clouds, hail, and a risk gauge.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6fa8d7"/>
      <stop offset="0.42" stop-color="#234567"/>
      <stop offset="1" stop-color="#08111f"/>
    </linearGradient>
    <radialGradient id="sun" cx="0.74" cy="0.16" r="0.46">
      <stop offset="0" stop-color="#ffe69a" stop-opacity="0.7"/>
      <stop offset="0.34" stop-color="#8ccfff" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#8ccfff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="cloud" cx="0.5" cy="0.5" r="0.55">
      <stop offset="0" stop-color="#dff5ff" stop-opacity="0.5"/>
      <stop offset="0.55" stop-color="#8fb6cf" stop-opacity="0.24"/>
      <stop offset="1" stop-color="#8fb6cf" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="risk" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5ee0a0"/>
      <stop offset="0.52" stop-color="#ffd166"/>
      <stop offset="1" stop-color="#ff6b6b"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="28" stdDeviation="34" flood-color="#030812" flood-opacity="0.45"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="#0b1422"/>
  <rect width="1200" height="630" fill="url(#sky)"/>
  <rect width="1200" height="630" fill="url(#sun)"/>
  <g opacity="0.8">
    <ellipse cx="360" cy="154" rx="310" ry="86" fill="url(#cloud)" transform="rotate(-7 360 154)"/>
    <ellipse cx="674" cy="218" rx="360" ry="94" fill="url(#cloud)" transform="rotate(-3 674 218)"/>
    <ellipse cx="894" cy="126" rx="290" ry="74" fill="url(#cloud)" transform="rotate(8 894 126)"/>
  </g>
  <g stroke="#c4e9ff" stroke-linecap="round" opacity="0.26">
    <path d="M76 72v55"/>
    <path d="M158 262v72"/>
    <path d="M318 120v84"/>
    <path d="M502 72v74"/>
    <path d="M730 264v96"/>
    <path d="M874 104v66"/>
    <path d="M1028 228v88"/>
    <path d="M1118 84v66"/>
  </g>
  <g fill="#eefbff" opacity="0.58">
    <circle cx="138" cy="404" r="7"/>
    <circle cx="292" cy="318" r="8"/>
    <circle cx="438" cy="444" r="5"/>
    <circle cx="748" cy="400" r="8"/>
    <circle cx="974" cy="352" r="6"/>
    <circle cx="1076" cy="474" r="9"/>
  </g>
  <g filter="url(#softShadow)">
    <rect x="56" y="56" width="1088" height="518" rx="42" fill="#0a1422" fill-opacity="0.42" stroke="#ffffff" stroke-opacity="0.24"/>
    <text x="104" y="190" fill="#c9dded" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="34" font-weight="700" letter-spacing="5">HAIL RISK FORECAST</text>
    <text x="100" y="302" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="116" font-weight="760">HailCast</text>
    <text x="108" y="384" fill="#d4e4ef" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="44">Live hail outlook for your location</text>
    <rect x="108" y="454" width="476" height="16" rx="8" fill="#ffffff" fill-opacity="0.16"/>
    <rect x="108" y="454" width="356" height="16" rx="8" fill="url(#risk)"/>
    <text x="108" y="522" fill="#b9cbd8" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="30">Armenian first, English included</text>
    <circle cx="920" cy="326" r="116" fill="#101a28" stroke="#2e4056" stroke-width="20"/>
    <circle cx="920" cy="326" r="88" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="18"/>
    <path d="M920 238a88 88 0 1 1-78 128" fill="none" stroke="#ffd166" stroke-width="20" stroke-linecap="round"/>
    <text x="920" y="318" text-anchor="middle" fill="#ffffff" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="58" font-weight="760">61%</text>
    <text x="920" y="366" text-anchor="middle" fill="#b7c9d7" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="26">hail risk</text>
  </g>
